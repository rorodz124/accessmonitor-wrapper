services:
  accessmonitor:
    build:
      context: ../accessmonitor-docker
      dockerfile: Dockerfile
    env_file:
      - ../accessmonitor-docker/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  wrapper-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5296:5296"
    environment:
      - AccessMonitor__BaseUrl=http://accessmonitor:3000
      - AccessMonitor__Referer=http://localhost:3000
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      accessmonitor:
        condition: service_healthy
