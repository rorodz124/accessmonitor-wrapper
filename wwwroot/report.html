<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório de Acessibilidade</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0; min-height: 100vh;
      background: #f3f4f6; color: #111827;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 32px 24px; box-sizing: border-box;
    }
    .page {
      width: min(100%, 860px); background: #fff;
      border-radius: 24px; box-shadow: 0 20px 75px rgba(15,23,42,.12);
      padding: 32px; box-sizing: border-box;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 2.5vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; }
    .link-button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 18px; border: none; border-radius: 12px;
      background: #f1f5f9; color: #0f172a; font-size: .9rem; font-weight: 600;
      text-decoration: none; white-space: nowrap; cursor: pointer;
      transition: background .15s;
    }
    .link-button:hover { background: #e2e8f0; }

    .summary-card {
      display: flex; align-items: center; gap: 28px;
      border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 24px 28px;
      background: #f8fafc; margin-top: 20px; flex-wrap: wrap;
    }

    .score-circle { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
    .score-circle svg { transform: rotate(-90deg); }
    .score-bg { fill: none; stroke: #e2e8f0; stroke-width: 10; }
    .score-fg { fill: none; stroke-width: 10; stroke-linecap: round; }
    .score-text {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 800; color: #111827; line-height: 1;
    }
    .score-text small { font-size: .7rem; font-weight: 500; color: #64748b; margin-top: 2px; }

    .score-meta { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .score-title { font-weight: 700; font-size: 1.1rem; color: #111827; line-height: 1.4; }
    .score-elems-row { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
    .score-elems { font-size: 1.5rem; font-weight: 800; color: #111827; }
    .score-elems-label { font-size: .8rem; color: #64748b; }

    .report-section { margin-top: 32px; }
    .report-section-title { font-size: 1.25rem; font-weight: 800; margin: 0 0 16px; color: #111827; }

    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 999px; border: 2px solid #e2e8f0;
      background: #fff; font-size: .85rem; font-weight: 700; cursor: pointer;
      transition: all .15s; color: #475569;
    }
    .tab-btn .tab-count {
      background: #e2e8f0; color: #475569;
      border-radius: 999px; padding: 1px 7px; font-size: .75rem; font-weight: 700;
    }
    .tab-btn.active-failed  { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
    .tab-btn.active-failed  .tab-count { background: #dc2626; color: #fff; }
    .tab-btn.active-warning { background: #fef9c3; border-color: #ca8a04; color: #92400e; }
    .tab-btn.active-warning .tab-count { background: #ca8a04; color: #fff; }
    .tab-btn.active-passed  { background: #dcfce7; border-color: #16a34a; color: #166534; }
    .tab-btn.active-passed  .tab-count { background: #16a34a; color: #fff; }

    .report-list { display: grid; gap: 10px; }
    .report-item {
      border: 1px solid #e5e7eb; border-radius: 14px;
      background: #fff; overflow: hidden;
    }
    .report-item.failed  { border-left: 5px solid #dc2626; }
    .report-item.warning { border-left: 5px solid #d97706; }
    .report-item.passed  { border-left: 5px solid #16a34a; }

    .item-head {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .item-head:hover { background: #f8fafc; }
    .pill {
      flex-shrink: 0; border-radius: 999px; padding: 3px 10px;
      font-size: .75rem; font-weight: 700;
    }
    .pill.failed  { background: #fee2e2; color: #991b1b; }
    .pill.warning { background: #fef3c7; color: #92400e; }
    .pill.passed  { background: #dcfce7; color: #166534; }
    .pill.code    { background: #f1f5f9; color: #475569; font-family: ui-monospace, monospace; }
    .item-desc  { flex: 1; font-size: .92rem; line-height: 1.5; padding-top: 2px; color: #1e293b; }
    .arrow { color: #94a3b8; flex-shrink: 0; padding-top: 4px; transition: transform .2s; font-size: .9rem; }
    .arrow.open { transform: rotate(180deg); }

    .item-body { display: none; padding: 0 16px 14px; border-top: 1px solid #f1f5f9; }
    .item-body.open { display: block; }
    .element-list { display: grid; gap: 8px; margin-top: 10px; }
    .element-card {
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 10px; padding: 10px 12px;
    }
    .element-ptr { font-size: .78rem; color: #64748b; margin-bottom: 5px; }
    pre {
      margin: 0; font: .82rem/1.5 ui-monospace, Menlo, monospace;
      white-space: pre-wrap; word-break: break-all; color: #0f172a; overflow-x: auto;
    }
    .more-elems { color: #64748b; font-size: .82rem; margin: 8px 0 0; }
    .empty-state { padding: 20px; color: #64748b; font-size: .9rem; text-align: center; }

    .notice { padding: 18px; border-radius: 18px; margin-top: 24px; }
    .notice.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .page { padding: 20px; }
      .summary-card { flex-direction: column; gap: 16px; padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1>Relatório de Acessibilidade</h1>
      <button class="link-button" id="btnBack">Voltar</button>
    </div>

    <div id="summaryArea"></div>
    <div id="reportSection"></div>
  </main>

  <script>
    const btnBack = document.getElementById('btnBack');
    const summaryArea = document.getElementById('summaryArea');
    const reportSec = document.getElementById('reportSection');

    const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

    btnBack.addEventListener('click', () => {
      if (document.referrer && (document.referrer.includes('ValidateHtml') || document.referrer.includes('ValidateUrl'))) {
        window.location.href = document.referrer;
        return;
      }

      window.history.back();
      setTimeout(() => {
        window.location.href = '/ValidateUrl.html';
      }, 100);
    });


    function getInner(r) { return r?.data?.data ?? r?.data ?? r; }

    function parseScore(v) { return parseFloat(String(v ?? '').replace(',', '.')); }

    function normalizeVerdict(v) {
      const s = String(v ?? '').trim().toLowerCase();
      if (['failed','fail','false','error','errors'].includes(s)) return 'failed';
      if (['warning','warn','alert'].includes(s))        return 'warning';
      if (['passed','pass','true','success','ok'].includes(s)) return 'passed';
      if (['inapplicable','n/a','na','not applicable','nao aplicavel'].includes(s)) return 'inapplicable';
      console.warn('AccessMonitor devolveu um verdict desconhecido:', v);
      return 'warning';
    }

    function extractItems(report) {
      const nodes = getInner(report)?.nodes ?? {};
      const groups = new Map();
      for (const [criterion, checks] of Object.entries(nodes)) {
        if (!Array.isArray(checks)) continue;
        for (const check of checks) {
          const v = normalizeVerdict(check.verdict);
          if (v === 'inapplicable') continue;
          const description = check.description || criterion;
          const key = `${v}|${check.resultCode||''}|${description}`;
          if (!groups.has(key)) {
            groups.set(key, { verdict: v, raw: { criterion, description, resultCode: check.resultCode, elements: [] } });
          }
          const g = groups.get(key).raw;
          if (Array.isArray(check.elements)) g.elements.push(...check.elements);
        }
      }
      return [...groups.values()];
    }

    function renderGauge(score, targetId) {
      const val = score ?? 0;
      const r = 46, circ = 2 * Math.PI * r, dash = circ * 0.75;
      const color = val >= 7 ? '#16a34a' : val >= 4 ? '#d97706' : '#dc2626';
      const target = -((dash - val / 10 * dash) - circ * .125);
      return {
        html: `
          <div class="score-circle">
            <svg viewBox="0 0 110 110" width="110" height="110">
              <circle class="score-bg" cx="55" cy="55" r="${r}"
                stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-(circ*.125)}" />
              <circle class="score-fg" id="${targetId}" cx="55" cy="55" r="${r}"
                stroke="${color}"
                stroke-dasharray="${dash} ${circ-dash}"
                stroke-dashoffset="${dash + circ*.125}"
                data-target="${target}" />
            </svg>
            <div class="score-text">${score ?? '—'}<small>Pontuação</small></div>
          </div>`,
        target
      };
    }


    function renderSummary(report) {
      const inner = getInner(report);
      const score = inner?.score != null ? parseScore(inner.score) : null;
      const totalElems = inner?.elems
        ? Object.values(inner.elems).reduce((s, v) => s + (typeof v === 'number' ? v : 0), 0)
        : null;

      const gauge = renderGauge(score, 'gaugeArc');

      summaryArea.innerHTML = `
        <div class="summary-card">
          ${gauge.html}
          <div class="score-meta">
            <div class="score-title">${inner?.title ? esc(inner.title) : 'Página Validada'}</div>
            ${totalElems != null ? `
              <div class="score-elems-row">
                <span class="score-elems">${totalElems}</span>
                <span class="score-elems-label">Elementos (x)HTML</span>
              </div>` : ''}
          </div>
        </div>`;

      requestAnimationFrame(() => {
        const arc = document.getElementById('gaugeArc');
        if (arc) {
          arc.style.transition = 'stroke-dashoffset .8s ease';
          arc.style.strokeDashoffset = arc.dataset.target;
        }
      });
    }


    let activeFilter = 'failed';

    function renderReport(items) {
      const groups = {
        failed:  items.filter(i => i.verdict === 'failed'),
        warning: items.filter(i => i.verdict === 'warning'),
        passed:  items.filter(i => i.verdict === 'passed'),
      };

      if (!groups[activeFilter]?.length) {
        activeFilter = groups.failed.length ? 'failed'
          : groups.warning.length ? 'warning' : 'passed';
      }

      reportSec.innerHTML = `
        <div class="report-section" id="fullReport">
          <div class="report-section-title">Relatório completo</div>
          <div class="filter-tabs">
            ${renderTab('failed',  'Falharam',  groups.failed.length)}
            ${renderTab('warning', 'Avisos',    groups.warning.length)}
            ${renderTab('passed',  'Passaram',  groups.passed.length)}
          </div>
          <div id="reportList" class="report-list">
            ${renderItems(groups[activeFilter])}
          </div>
        </div>`;

      reportSec.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          reportSec.querySelectorAll('.tab-btn').forEach(b => {
            b.className = 'tab-btn' + (b.dataset.filter === activeFilter ? ` active-${activeFilter}` : '');
          });
          document.getElementById('reportList').innerHTML = renderItems(groups[activeFilter]);
          attachToggle();
        });
      });

      attachToggle();
    }

    function renderTab(filter, label, count) {
      const active = filter === activeFilter;
      return `<button class="tab-btn${active ? ` active-${filter}` : ''}" data-filter="${filter}">
        ${label} <span class="tab-count">${count}</span>
      </button>`;
    }

    function renderItems(items) {
      if (!items.length) return `<div class="empty-state">Nenhum resultado nesta categoria.</div>`;
      return items.map(item => renderItem(item)).join('');
    }

    function renderItem(item) {
      const check = item.raw;
      const els = (check.elements ?? []).slice(0, 6);
      const hasBody = els.length > 0;
      return `
        <article class="report-item ${item.verdict}">
          <div class="item-head">
            <span class="pill ${item.verdict}">${
              item.verdict === 'failed' ? 'Falhou' :
              item.verdict === 'warning' ? 'Aviso' : 'Passou'
            }</span>
            ${check.resultCode ? `<span class="pill code">${esc(check.resultCode)}</span>` : ''}
            <span class="item-desc">${esc(check.description ?? 'Sem descrição.')}</span>
            ${hasBody ? `<span class="arrow">▾</span>` : ''}
          </div>
          ${hasBody ? `
            <div class="item-body">
              <div class="element-list">
                ${els.map(el => `
                  <div class="element-card">
                    ${el.pointer  ? `<div class="element-ptr">📍 ${esc(el.pointer)}</div>` : ''}
                    ${el.htmlCode ? `<pre>${esc(el.htmlCode)}</pre>` : ''}
                    ${el.accessibleName ? `<div class="element-ptr">Nome acessível: ${esc(el.accessibleName)}</div>` : ''}
                  </div>`).join('')}
                ${(check.elements?.length ?? 0) > 6 ? `<p class="more-elems">+ ${check.elements.length - 6} elemento(s) adicionais</p>` : ''}
              </div>
            </div>` : ''}
        </article>`;
    }

    function attachToggle() {
      reportSec.querySelectorAll('.item-head').forEach(head => {
        head.addEventListener('click', () => {
          const body  = head.nextElementSibling;
          const arrow = head.querySelector('.arrow');
          if (!body) return;
          const open = body.classList.toggle('open');
          arrow?.classList.toggle('open', open);
        });
      });
    }

    window.addEventListener('load', () => {
      const rawReport = sessionStorage.getItem('currentReport');
      if (!rawReport) {
        summaryArea.innerHTML = `<p class="notice error">Nenhum relatório encontrado. Por favor, volte e efetue uma validação.</p>`;
        return;
      }
      try {
        const report = JSON.parse(rawReport);
        const items = extractItems(report);
        activeFilter = items.some(i => i.verdict === 'failed') ? 'failed'
          : items.some(i => i.verdict === 'warning') ? 'warning' : 'passed';

        renderSummary(report);
        renderReport(items);
      } catch (err) {
        summaryArea.innerHTML = `<p class="notice error">Erro ao carregar o relatório: ${esc(err.message)}</p>`;
      }
    });
  </script>
</body>
</html>
