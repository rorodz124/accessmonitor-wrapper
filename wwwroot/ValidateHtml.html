<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validar HTML</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh;background:#f3f4f6;color:#111827;padding:32px 24px;box-sizing:border-box}
    .page{width:min(100%,760px);margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 20px 75px rgba(15,23,42,.10);padding:36px;box-sizing:border-box}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
    h1{margin:0;font-size:clamp(1.4rem,2.5vw,1.9rem);font-weight:800;letter-spacing:-.02em}
    .link-button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;border:none;border-radius:12px;background:#f1f5f9;color:#0f172a;font-size:.9rem;font-weight:600;text-decoration:none;white-space:nowrap}
    .link-button:hover{background:#e2e8f0}
    label{display:block;margin-bottom:8px;font-weight:600;font-size:.9rem;color:#374151}

    textarea{width:100%;min-height:280px;resize:vertical;padding:14px 16px;border:1.5px solid #e2e8f0;border-radius:14px;font:.9rem/1.6 ui-monospace,Menlo,monospace;color:#0f172a;outline:none;box-sizing:border-box;background:#f8fafc;margin-bottom:20px;transition:border-color .15s,box-shadow .15s}
    textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.10)}

    button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 20px;border:2px solid transparent;border-radius:12px;font-size:.92rem;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
    button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
    button.primary:hover{background:#1d4ed8;border-color:#1d4ed8}
    button.primary:disabled{background:#93c5fd;border-color:#93c5fd;cursor:not-allowed}
    button.secondary{background:#f1f5f9;color:#374151;border-color:#e2e8f0}
    button.secondary:hover{background:#e2e8f0}
    button.auto-off{background:#f8fafc;color:#475569;border-color:#e2e8f0}
    button.auto-off:hover{border-color:#94a3b8}
    button.auto-on{background:#f0fdf4;color:#166534;border-color:#4ade80}
    button.auto-on .auto-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 1.4s ease-in-out infinite}
    button.auto-off .auto-dot{display:none}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    .meta-right{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
    .status-text{font-size:.82rem;color:#94a3b8}
    .countdown-text{font-size:.82rem;color:#64748b;font-variant-numeric:tabular-nums}
    .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;flex-shrink:0}
    @keyframes sp{to{transform:rotate(360deg)}}

    .summary-card{margin-top:28px;border-radius:20px;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);border:1.5px solid #e2e8f0;padding:28px 32px;display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
    .score-circle{position:relative;width:100px;height:100px;flex-shrink:0}
    .score-circle svg{transform:rotate(-90deg)}
    .score-bg{fill:none;stroke:#e2e8f0;stroke-width:9}
    .score-fg{fill:none;stroke-width:9;stroke-linecap:round}
    .score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.65rem;font-weight:800;color:#111827;line-height:1}
    .score-text small{font-size:.65rem;font-weight:500;color:#94a3b8;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
    .vdiv{width:1px;height:70px;background:#e2e8f0;flex-shrink:0}
    .stats-group{display:flex;gap:14px}
    .stat-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 28px;border-radius:16px;min-width:80px;border:1.5px solid transparent}
    .stat-chip.errors{background:#fff1f2;border-color:#fecdd3}
    .stat-chip.warnings{background:#fffbeb;border-color:#fde68a}
    .stat-chip .num{font-size:2.2rem;font-weight:900;line-height:1}
    .stat-chip.errors .num{color:#dc2626}
    .stat-chip.warnings .num{color:#d97706}
    .stat-chip .lbl{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7280}
    .issues-section{margin-top:28px}
    .issues-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-bottom:12px}
    .issue-list{display:grid;gap:8px}
    .issue-item{border-radius:14px;background:#fff;border:1.5px solid #e5e7eb;overflow:hidden}
    .issue-item.failed{border-left:4px solid #ef4444}
    .issue-item.warning{border-left:4px solid #f59e0b}
    .issue-row{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
    .issue-row:hover{background:#f8fafc}
    .pill{flex-shrink:0;border-radius:8px;padding:2px 9px;font-size:.72rem;font-weight:700}
    .pill.failed{background:#fee2e2;color:#b91c1c}
    .pill.warning{background:#fef3c7;color:#92400e}
    .pill.code{background:#f1f5f9;color:#475569;font-family:ui-monospace,monospace}
    .issue-desc{flex:1;font-size:.9rem;line-height:1.5;color:#1e293b;padding-top:1px}
    .chevron{color:#cbd5e1;flex-shrink:0;margin-top:3px;transition:transform .2s;font-size:.8rem}
    .chevron.open{transform:rotate(180deg)}
    .issue-body{display:none;padding:0 16px 14px}
    .issue-body.open{display:block}
    .element-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-top:6px}
    .element-ptr{font-size:.76rem;color:#64748b;margin-bottom:4px}
    pre{margin:0;font:.8rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;color:#0f172a}
    .more-elems{color:#94a3b8;font-size:.8rem;margin:6px 0 0}
    .notice-ok{margin-top:24px;padding:16px 20px;border-radius:14px;background:#f0fdf4;color:#166534;border:1.5px solid #bbf7d0;font-size:.9rem}
    .notice-err{margin-top:24px;padding:16px 20px;border-radius:14px;background:#fff1f2;color:#b91c1c;border:1.5px solid #fecdd3;font-size:.9rem}
    @media(max-width:520px){body{padding:12px}.page{padding:20px;border-radius:16px}.topbar{flex-direction:column;align-items:flex-start}.summary-card{padding:20px;gap:20px}.stats-group{gap:10px}.stat-chip{padding:14px 18px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1>Validar HTML</h1>
      <a class="link-button" href="/ValidateUrl.html">Validar por URL</a>
    </div>

    <label for="htmlInput">Conteúdo HTML</label>
    <textarea id="htmlInput" spellcheck="false"
      placeholder="<!doctype html>&#10;<html lang=&quot;pt&quot;>&#10;  <head><title>Página</title></head>&#10;  <body><h1>Título</h1></body>&#10;</html>"></textarea>

    <div class="actions">
      <button class="primary" id="btnVerify">Verificar</button>
      <button class="secondary" id="btnClear">Limpar</button>
      <button class="auto-off" id="btnAuto">
        <span class="auto-dot"></span>
        Auto-verificar
      </button>
      <div class="meta-right">
        <span class="countdown-text" id="countdownText"></span>
        <span class="status-text" id="statusText" aria-live="polite"></span>
      </div>
    </div>

    <div id="results"></div>
    <div id="issuesSection"></div>
  </main>

  <script>
    const $  = id => document.getElementById(id);
    const btnV = $('btnVerify'), btnC = $('btnClear'), btnAuto = $('btnAuto');
    const statusEl = $('statusText'), countdownEl = $('countdownText');
    const resultsEl = $('results'), issuesSec = $('issuesSection');
    let ac = null;

    const taEl = $('htmlInput');

    const esc = v => String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

    btnC.onclick = () => {
      taEl.value = '';
      resultsEl.innerHTML = ''; issuesSec.innerHTML = '';
      statusEl.textContent = '';
      sessionStorage.removeItem('lastHtml'); sessionStorage.removeItem('lastHtmlReport');
    };

    const AUTO_SECS = 30;
    let autoEnabled = false, autoTimer = null, autoCountdown = AUTO_SECS;

    btnAuto.onclick = () => {
      autoEnabled = !autoEnabled;
      btnAuto.className = autoEnabled ? 'auto-on' : 'auto-off';
      if (autoEnabled) { autoCountdown = AUTO_SECS; updateCountdown(); autoTimer = setInterval(autoTick, 1000); }
      else { clearInterval(autoTimer); autoTimer = null; countdownEl.textContent = ''; }
    };
    function autoTick() { if (--autoCountdown <= 0) { autoCountdown = AUTO_SECS; runValidation(); } updateCountdown(); }
    function updateCountdown() { countdownEl.textContent = autoEnabled ? `próxima verificação em ${autoCountdown}s` : ''; }
    taEl.addEventListener('input', () => { if (autoEnabled) { autoCountdown = AUTO_SECS; updateCountdown(); } });

    btnV.onclick = runValidation;

    async function runValidation() {
      const html = taEl.value.trim();
      if (!html) {
        resultsEl.innerHTML = '<div class="notice-err">Insira HTML antes de verificar.</div>';
        issuesSec.innerHTML = ''; return;
      }
      ac?.abort(); ac = new AbortController();
      btnV.disabled = true; btnV.innerHTML = '<span class="spin"></span> A verificar…';
      resultsEl.innerHTML = ''; issuesSec.innerHTML = ''; statusEl.textContent = '';

      const fullHtml = html.toLowerCase().includes('<!doctype') ? html
        : `<!DOCTYPE html>\n<html lang="pt">\n<head>\n  <meta charset="UTF-8">\n  <title>Página de Teste</title>\n</head>\n<body>\n  ${html}\n</body>\n</html>`;

      try {
        const res  = await fetch('/api/validate/html', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({html:fullHtml}), signal:ac.signal });
        const json = await res.json();
        if (!res.ok) { resultsEl.innerHTML = `<div class="notice-err">${esc(json.error??`Erro ${res.status}`)}</div>`; return; }
        sessionStorage.setItem('lastHtml', html); sessionStorage.setItem('lastHtmlReport', JSON.stringify(json));
        renderSummary(json); renderIssues(json);
        statusEl.textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
      } catch(e) {
        if (e.name !== 'AbortError') resultsEl.innerHTML = '<div class="notice-err">Não foi possível contactar o serviço. Tente novamente.</div>';
      } finally { btnV.disabled = false; btnV.innerHTML = 'Verificar'; ac = null; }
    }

    const getInner = r => r?.data?.data ?? r?.data ?? r;
    function parseScore(v) { return parseFloat(String(v ?? '').replace(',', '.')); }
    function normalizeVerdict(v) {
      const s = String(v??'').trim().toLowerCase();
      if (['failed','fail','false','error','errors'].includes(s)) return 'failed';
      if (['warning','warn','alert'].includes(s)) return 'warning';
      if (['passed','pass','true','success','ok'].includes(s)) return 'passed';
      if (['inapplicable','n/a','na','not applicable','nao aplicavel'].includes(s)) return 'inapplicable';
      console.warn('AccessMonitor devolveu um verdict desconhecido:', v);
      return 'warning';
    }
    function extractItems(r) {
      const nodes = getInner(r)?.nodes ?? {};
      const groups = new Map();
      for (const [criterion, checks] of Object.entries(nodes)) {
        if (!Array.isArray(checks)) continue;
        for (const c of checks) {
          const v = normalizeVerdict(c.verdict);
          if (v === 'inapplicable') continue;
          const description = c.description || criterion;
          const key = `${v}|${c.resultCode||''}|${description}`;
          if (!groups.has(key)) {
            groups.set(key, { verdict: v, criterion, description, resultCode: c.resultCode, elements: [] });
          }
          const g = groups.get(key);
          if (Array.isArray(c.elements)) g.elements.push(...c.elements);
        }
      }
      return [...groups.values()];
    }

    function renderSummary(r) {
      const inner = getInner(r), score = inner?.score != null ? parseScore(inner.score) : 0;
      const items = extractItems(r);
      const errs = items.filter(i=>i.verdict==='failed'), warns = items.filter(i=>i.verdict==='warning');
      const color = score>=7?'#16a34a':score>=4?'#d97706':'#dc2626';
      const R=42, circ=2*Math.PI*R, dash=circ*.75, target=-((dash-score/10*dash)-circ*.125);
      sessionStorage.setItem('currentReport', JSON.stringify(r));
      resultsEl.innerHTML = `
        <div class="summary-card">
          <div class="score-circle">
            <svg viewBox="0 0 100 100" width="100" height="100">
              <circle class="score-bg" cx="50" cy="50" r="${R}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-(circ*.125)}"/>
              <circle class="score-fg" id="gaugeArc" cx="50" cy="50" r="${R}" stroke="${color}"
                stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${dash+circ*.125}" data-target="${target}"/>
            </svg>
            <div class="score-text">${score.toFixed(1)}<small>Score</small></div>
          </div>
          <div class="vdiv"></div>
          <div class="stats-group">
            <div class="stat-chip errors"><span class="num">${errs.length}</span><span class="lbl">Erros</span></div>
            <div class="stat-chip warnings"><span class="num">${warns.length}</span><span class="lbl">Avisos</span></div>
          </div>
        </div>`;
      requestAnimationFrame(() => {
        const arc = document.getElementById('gaugeArc');
        if (arc) { arc.style.transition='stroke-dashoffset .8s ease'; arc.style.strokeDashoffset=arc.dataset.target; }
      });
    }

    function renderIssues(r) {
      const items = extractItems(r);
      const all = [...items.filter(i=>i.verdict==='failed'),...items.filter(i=>i.verdict==='warning')];
      if (!all.length) { issuesSec.innerHTML = '<div class="notice-ok">✅ Nenhum problema de acessibilidade encontrado neste HTML.</div>'; return; }
      issuesSec.innerHTML = `<div class="issues-section"><div class="issues-title">Erros e Avisos encontrados</div><div class="issue-list">${all.map(renderIssue).join('')}</div></div>`;
      issuesSec.querySelectorAll('.issue-row').forEach(row => {
        row.addEventListener('click', () => {
          const body = row.nextElementSibling, chev = row.querySelector('.chevron');
          if (body) { const open = body.classList.toggle('open'); chev?.classList.toggle('open', open); }
        });
      });
    }

    function renderIssue(item) {
      const els = (item.elements||[]).slice(0,5), hasBody = els.length>0;
      return `<article class="issue-item ${item.verdict}">
        <div class="issue-row">
          <span class="pill ${item.verdict}">${item.verdict==='failed'?'Erro':'Aviso'}</span>
          ${item.resultCode?`<span class="pill code">${esc(item.resultCode)}</span>`:''}
          <span class="issue-desc">${esc(item.description||'(sem descrição)')}</span>
          ${hasBody?'<span class="chevron">▾</span>':''}
        </div>
        ${hasBody?`<div class="issue-body">${els.map(el=>`<div class="element-card">
          ${el.pointer?`<div class="element-ptr">📍 ${esc(el.pointer)}</div>`:''}
          ${el.htmlCode?`<pre>${esc(el.htmlCode)}</pre>`:''}
        </div>`).join('')}${(item.elements?.length??0)>5?`<p class="more-elems">+ ${item.elements.length-5} elemento(s) adicionais</p>`:''}</div>`:''}
      </article>`;
    }

    window.addEventListener('load', () => {
      const h = sessionStorage.getItem('lastHtml'), rep = sessionStorage.getItem('lastHtmlReport');
      if (h && rep) { taEl.value = h; const r = JSON.parse(rep); renderSummary(r); renderIssues(r); }
    });
  </script>
</body>
</html>
