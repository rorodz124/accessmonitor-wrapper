<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validar HTML | AccessMonitor Wrapper</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0; min-height: 100vh;
      background: #f3f4f6; color: #111827;
      padding: 24px; box-sizing: border-box;
    }
    .page {
      width: min(100%, 860px); margin: 0 auto; background: #fff;
      border-radius: 24px; box-shadow: 0 20px 75px rgba(15,23,42,.12);
      padding: 32px; box-sizing: border-box;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 2.5vw, 2.2rem); }
    .link-button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 20px; border: none; border-radius: 14px;
      background: #e2e8f0; color: #0f172a; font-size: 1rem; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }

    label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea {
      width: 100%; min-height: 280px; resize: vertical;
      padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 14px;
      font: .9rem/1.6 ui-monospace, Menlo, monospace; color: #0f172a;
      outline: none; box-sizing: border-box; background: #f8fafc;
    }
    textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; align-items: center; }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 20px; border: none; border-radius: 14px;
      background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button:disabled  { background: #93c5fd; cursor: not-allowed; }
    .status-text { font-size: .9rem; color: #64748b; margin-left: auto; }

    .summary-card {
      margin-top: 28px; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 24px; background: #f8fafc;
      display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    }

    .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
    .score-circle { position: relative; width: 120px; height: 120px; }
    .score-circle svg { transform: rotate(-90deg); }
    .score-circle .score-bg { fill: none; stroke: #e2e8f0; stroke-width: 10; }
    .score-circle .score-fg { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
    .score-text {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: #111827; line-height: 1;
    }
    .score-text small { font-size: .75rem; font-weight: 500; color: #64748b; margin-top: 2px; }

    .summary-info { flex: 1; min-width: 200px; }
    .summary-info h2 { margin: 0 0 12px; font-size: .85rem; color: #64748b; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border-radius: 999px; padding: 5px 13px; font-size: .82rem; font-weight: 700; }
    .chip-red   { background: #fee2e2; color: #991b1b; }
    .chip-amber { background: #fef3c7; color: #92400e; }
    .chip-slate { background: #e2e8f0; color: #334155; }
    .chip-green { background: #dcfce7; color: #166534; }
    .conform-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .conform-badge {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 6px 14px; font-size: .8rem; font-weight: 700; text-align: center;
    }
    .conform-badge .level { display: block; font-size: .7rem; color: #64748b; font-weight: 400; margin-top: 1px; }
    .conform-badge.has-errors { border-color: #fecaca; background: #fee2e2; color: #991b1b; }


    .section { margin-top: 28px; }
    .section-title {
      font-size: 1rem; font-weight: 800; margin: 0 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .count-pill {
      border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700;
      background: #fee2e2; color: #991b1b;
    }
    .count-pill.warn { background: #fef3c7; color: #92400e; }

    .issue-list { display: grid; gap: 10px; }
    .issue {
      border: 1px solid #e5e7eb; border-left: 5px solid #dc2626;
      border-radius: 14px; overflow: hidden; background: #fff;
    }
    .issue.warning { border-left-color: #d97706; }

    .issue-head {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .issue-head:hover { background: #f8fafc; }
    .pill {
      flex-shrink: 0; border-radius: 999px; padding: 3px 10px;
      font-size: .75rem; font-weight: 700;
    }
    .pill.error   { background: #fee2e2; color: #991b1b; }
    .pill.warning { background: #fef3c7; color: #92400e; }
    .pill.crit    { background: #e2e8f0; color: #334155; }
    .issue-desc   { flex: 1; font-size: .92rem; line-height: 1.5; padding-top: 2px; }
    .arrow { color: #94a3b8; flex-shrink: 0; padding-top: 4px; transition: transform .2s; }
    .arrow.open { transform: rotate(180deg); }

    .issue-body { display: none; padding: 0 16px 14px; border-top: 1px solid #f1f5f9; }
    .issue-body.open { display: block; }
    .elem-list { display: grid; gap: 8px; margin-top: 10px; }
    .elem {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px;
    }
    .elem-ptr { font-size: .78rem; color: #64748b; margin-bottom: 5px; }
    pre { margin: 0; font: .82rem/1.5 ui-monospace, Menlo, monospace;
          white-space: pre-wrap; word-break: break-all; color: #0f172a; overflow-x: auto; }


    .notice {
      margin-top: 24px; padding: 18px 20px; border-radius: 16px;
      font-size: .92rem; line-height: 1.5;
    }
    .notice-ok  { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .notice-err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }


    .spin {
      width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: sp .6s linear infinite; flex-shrink: 0;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .page { padding: 20px; border-radius: 16px; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1>Validar HTML</h1>
      <a class="link-button" href="/ValidateUrl.html">Validar por URL</a>
    </div>

    <label for="htmlInput">Conteúdo HTML</label>
    <textarea id="htmlInput" spellcheck="false"
      placeholder="<!doctype html>&#10;<html lang=&quot;pt&quot;>&#10;  <head><title>Página</title></head>&#10;  <body><h1>Título</h1></body>&#10;</html>"></textarea>

    <div class="actions">
      <button id="btnVerify">Verificar</button>
      <button id="btnClear" class="secondary">Limpar</button>
      <span class="status-text" id="statusText" aria-live="polite"></span>
    </div>

    <div id="results"></div>
  </main>

  <script>
    const taEl = document.getElementById('htmlInput');
    const btnV = document.getElementById('btnVerify');
    const btnC = document.getElementById('btnClear');
    const status = document.getElementById('statusText');
    const results = document.getElementById('results');
    let ac = null;

    btnC.onclick = () => { taEl.value = ''; results.innerHTML = ''; status.textContent = ''; };
    btnV.onclick = runValidation;

    async function runValidation() {
      const html = taEl.value.trim();
      if (!html) { notice('err', 'Insira HTML antes de verificar.'); return; }

      ac?.abort(); ac = new AbortController();
      btnV.disabled = true;
      btnV.innerHTML = '<span class="spin"></span> A verificar…';
      results.innerHTML = '';
      status.textContent = '';

      try {
        const res  = await fetch('/api/validate/html', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ html }),
          signal: ac.signal
        });
        const json = await res.json();
        if (!res.ok) { notice('err', json.error || `Erro ${res.status}`); return; }
        renderResults(json);
        status.textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        if (e.name !== 'AbortError') notice('err', 'Não foi possível contactar o serviço. Tente novamente.');
      } finally {
        btnV.disabled = false;
        btnV.innerHTML = 'Verificar';
        ac = null;
      }
    }

    function renderResults(r) {
      const errors   = r.errors   || [];
      const warnings = r.warnings || [];
      const score    = parseFloat(r.score) || 0;
      const cA   = r.conform?.A   ?? '0';
      const cAA  = r.conform?.AA  ?? '0';
      const cAAA = r.conform?.AAA ?? '0';
      const color = score >= 7 ? '#16a34a' : score >= 4 ? '#d97706' : '#dc2626';

      const R = 50, circ = 2 * Math.PI * R, dash = circ * 0.75;
      const targetOffset = -((dash - score / 10 * dash) - circ * .125);

      let h = `
        <div class="summary-card">
          <div class="score-wrap">
            <div class="score-circle">
              <svg viewBox="0 0 120 120" width="120" height="120">
                <circle class="score-bg" cx="60" cy="60" r="${R}"
                  stroke-dasharray="${dash} ${circ - dash}"
                  stroke-dashoffset="${-(circ * .125)}" />
                <circle class="score-fg" id="gaugeArc" cx="60" cy="60" r="${R}"
                  stroke="${color}"
                  stroke-dasharray="${dash} ${circ - dash}"
                  stroke-dashoffset="${dash + circ * .125}"
                  data-target="${targetOffset}" />
              </svg>
              <div class="score-text">${score.toFixed(1)}<small>Pontuação</small></div>
            </div>
          </div>
          <div class="summary-info">
            <h2>Avaliação de acessibilidade</h2>
            <div class="chips">
              ${errors.length
                ? `<span class="chip chip-red"> ${errors.length} erro${errors.length !== 1 ? 's' : ''}</span>`
                : `<span class="chip chip-green">✓ Sem erros</span>`}
              ${warnings.length ? `<span class="chip chip-amber">⚠ ${warnings.length} aviso${warnings.length !== 1 ? 's' : ''}</span>` : ''}
            </div>
            <div class="conform-row">
              <div class="conform-badge ${+cA   > 0 ? 'has-errors' : ''}">
                ${cA} erro${cA   !== '1' ? 's' : ''}<span class="level">Nível A</span>
              </div>
              <div class="conform-badge ${+cAA  > 0 ? 'has-errors' : ''}">
                ${cAA} erro${cAA  !== '1' ? 's' : ''}<span class="level">Nível AA</span>
              </div>
              <div class="conform-badge ${+cAAA > 0 ? 'has-errors' : ''}">
                ${cAAA} erro${cAAA !== '1' ? 's' : ''}<span class="level">Nível AAA</span>
              </div>
            </div>
          </div>
        </div>`;

      if (!errors.length && !warnings.length) {
        h += `<div class="notice notice-ok">✅ Nenhum problema de acessibilidade encontrado neste HTML.</div>`;
      } else {
        if (errors.length) {
          h += `<div class="section">
            <div class="section-title">Erros <span class="count-pill">${errors.length}</span></div>
            <div class="issue-list">${errors.map((e, i) => renderIssue(e, 'error', i)).join('')}</div>
          </div>`;
        }
        if (warnings.length) {
          h += `<div class="section">
            <div class="section-title">Avisos <span class="count-pill warn">${warnings.length}</span></div>
            <div class="issue-list">${warnings.map((e, i) => renderIssue(e, 'warning', 1000 + i)).join('')}</div>
          </div>`;
        }
      }

      results.innerHTML = h;

      requestAnimationFrame(() => {
        const arc = document.getElementById('gaugeArc');
        if (arc) arc.style.strokeDashoffset = arc.dataset.target;
      });

      results.querySelectorAll('.issue-head').forEach(head => {
        head.addEventListener('click', () => {
          const body  = head.nextElementSibling;
          const arrow = head.querySelector('.arrow');
          if (!body) return;
          const open = body.classList.toggle('open');
          arrow?.classList.toggle('open', open);
        });
      });
    }

    function renderIssue(item, type, idx) {
      const elems = (item.elements || []).slice(0, 5);
      const elemsHtml = elems.length ? `
        <div class="elem-list">
          ${elems.map(el => `
            <div class="elem">
              ${el.pointer  ? `<div class="elem-ptr">📍 ${x(el.pointer)}</div>` : ''}
              ${el.htmlCode ? `<pre>${x(el.htmlCode)}</pre>` : ''}
            </div>`).join('')}
          ${(item.elements?.length ?? 0) > 5 ? `<p style="color:#64748b;font-size:.82rem;margin:8px 0 0">+ ${item.elements.length - 5} elemento(s) adicionais</p>` : ''}
        </div>` : '';

      const hasBody = !!elemsHtml;
      return `
        <article class="issue ${type}">
          <div class="issue-head">
            <span class="pill ${type}">${type === 'error' ? 'Erro' : 'Aviso'}</span>
            ${item.criterion ? `<span class="pill crit">${x(item.criterion)}</span>` : ''}
            <span class="issue-desc">${x(item.description || '(sem descrição)')}</span>
            ${hasBody ? `<span class="arrow">▾</span>` : ''}
          </div>
          ${hasBody ? `<div class="issue-body">${elemsHtml}</div>` : ''}
        </article>`;
    }

    function notice(type, msg) {
      results.innerHTML = `<div class="notice notice-${type === 'err' ? 'err' : 'ok'}">${x(msg)}</div>`;
    }

    const x = v => String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
  </script>
</body>
</html>
