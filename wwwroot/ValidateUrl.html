<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação por URL | AccessMonitor Wrapper</title>
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: min(100%, 860px);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 75px rgba(15, 23, 42, 0.12);
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 2.5vw, 2.5rem);
    }

    p {
      margin: 0 0 24px;
      color: #475569;
      line-height: 1.75;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1rem;
      color: #0f172a;
      outline: none;
      box-sizing: border-box;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      align-items: center;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .stat {
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px;
      background: #f8fafc;
      min-height: 96px;
    }

    .stat strong {
      display: block;
      margin-bottom: 10px;
      color: #475569;
    }

    .stat .value {
      font-size: 2rem;
      color: #111827;
    }

    .panel {
      margin-top: 24px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      background: #ffffff;
    }

    .panel header {
      padding: 18px 20px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .panel header h2 {
      margin: 0;
      font-size: 1rem;
      color: #0f172a;
    }

    .panel .content {
      display: none;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .panel .content.visible {
      display: block;
    }

    .notice {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: #e0f2fe;
      color: #0c4a6e;
      border: 1px solid #bae6fd;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Validar página por URL</h1>

    <label for="urlInput">URL da página</label>
    <input id="urlInput" type="text" placeholder="https://example.com" autocomplete="url" />

    <div class="actions">
      <button id="submitButton">Validar</button>
      <button id="toggleReportButton" type="button" disabled>Mostrar relatório completo</button>
    </div>

    <div id="resultArea"></div>

    <div class="panel" id="reportPanel" hidden>
      <header>
        <h2>Relatório completo</h2>
      </header>
      <div class="content" id="reportContent"></div>
    </div>
  </main>

  <script>
    const submitButton = document.getElementById('submitButton');
    const toggleReportButton = document.getElementById('toggleReportButton');
    const urlInput = document.getElementById('urlInput');
    const resultArea = document.getElementById('resultArea');
    const reportPanel = document.getElementById('reportPanel');
    const reportContent = document.getElementById('reportContent');

    let latestReportJson = null;

    submitButton.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      resultArea.innerHTML = '';
      reportPanel.hidden = true;
      reportContent.textContent = '';
      toggleReportButton.disabled = true;
      toggleReportButton.textContent = 'Mostrar relatório completo';

      if (!url) {
        resultArea.innerHTML = '<p class="notice" style="background:#fee2e2;color:#991b1b;border-color:#fecaca;">Insira um URL válido antes de continuar.</p>';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'A validar...';

      try {
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const text = await response.text();
        let json = null;

        try {
          json = JSON.parse(text);
        } catch (err) {
          throw new Error('Resposta inválida do servidor.');
        }

        if (!response.ok) {
          resultArea.innerHTML = `<div class="notice" style="background:#fee2e2;color:#991b1b;border-color:#fecaca;"><strong>Erro ${response.status}</strong><br>${json.error || response.statusText}</div>`;
          return;
        }

        latestReportJson = json;
        renderSummary(json);
        renderReport(json);
        toggleReportButton.disabled = false;
      } catch (error) {
        resultArea.innerHTML = `<div class="notice" style="background:#fef9c3;color:#92400e;border-color:#fde68a;"><strong>Falha ao contactar a API</strong><br>${error.message}</div>`;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Validar';
      }
    });

    toggleReportButton.addEventListener('click', () => {
      const visible = reportContent.classList.toggle('visible');
      reportPanel.hidden = !visible;
      toggleReportButton.textContent = visible ? 'Ocultar relatório completo' : 'Mostrar relatório completo';
    });

    function renderSummary(report) {
      const rawReport = report.rawResponse || report;
      const sources = [
        report,
        report.data,
        report.data?.data,
        rawReport,
        rawReport.data,
        rawReport.data?.data
      ].filter(Boolean);

      const summary = {
        Score: getValue(sources, [
          'score',
          'result',
          'statistics.globalScore',
          'globalScore',
          'resultGrade',
          'data.score',
          'data.result',
          'data.statistics.globalScore',
          'data.globalScore',
          'data.data.score',
          'data.data.result',
          'data.data.statistics.globalScore',
          'data.data.globalScore',
          'rawResponse.score',
          'rawResponse.result',
          'rawResponse.data.score',
          'rawResponse.data.result',
          'rawResponse.data.globalScore',
          'rawResponse.data.data.score',
          'rawResponse.data.data.result',
          'rawResponse.data.data.globalScore'
        ]),
        Passed: getMetric(sources, {
          paths: [
            'passed',
            'metrics.passed',
            'statistics.passed',
            'assertions_passed',
            'data.passed',
            'data.assertions_passed',
            'data.data.passed',
            'data.data.assertions_passed'
          ],
          keys: ['passed', 'pass', 'success', 'successful', 'assertionspassed', 'totalpassed'],
          results: ['passed', 'pass', 'success', 'successful', 'ok', 'true']
        }),
        Warnings: getMetric(sources, {
          paths: [
            'warnings',
            'warning',
            'metrics.warnings',
            'statistics.warnings',
            'assertions_warnings',
            'data.warnings',
            'data.warning',
            'data.assertions_warnings',
            'data.data.warnings',
            'data.data.warning',
            'data.data.assertions_warnings'
          ],
          keys: ['warnings', 'warning', 'warn', 'assertionswarnings', 'totalwarnings'],
          results: ['warning', 'warnings', 'warn']
        }),
        Failed: getMetric(sources, {
          paths: [
            'failed',
            'failures',
            'errors',
            'error',
            'metrics.failed',
            'metrics.errors',
            'statistics.failed',
            'statistics.errors',
            'assertions_failed',
            'data.failed',
            'data.failures',
            'data.errors',
            'data.error',
            'data.assertions_failed',
            'data.data.failed',
            'data.data.failures',
            'data.data.errors',
            'data.data.error',
            'data.data.assertions_failed'
          ],
          keys: ['failed', 'failures', 'errors', 'error', 'fail', 'assertionsfailed', 'totalfailed', 'totalerrors'],
          results: ['failed', 'fail', 'failure', 'error', 'errors', 'false']
        })
      };

      resultArea.innerHTML = `
        <div class="summary">
          ${Object.entries(summary).map(([label, value]) => `
            <div class="stat">
              <strong>${label}</strong>
              <div class="value">${value !== null ? value : '-'}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderReport(report) {
      reportContent.textContent = JSON.stringify(report, null, 2);
    }

    function getMetric(sources, options) {
      const directValue = getValue(sources, options.paths);
      if (directValue !== null) {
        return normalizeCount(directValue);
      }

      for (const source of sources) {
        const valueByKey = findByKey(source, options.keys);
        if (valueByKey !== null) {
          return valueByKey;
        }
      }

      for (const source of sources) {
        const count = countByResult(source, options.results);
        if (count > 0) {
          return count;
        }
      }

      return null;
    }

    function getValue(sources, paths) {
      for (const source of sources) {
        for (const path of paths) {
          const value = getPathValue(source, path);
          if (value !== undefined && value !== null) {
            return value;
          }
        }
      }
      return null;
    }

    function getPathValue(obj, path) {
      return path.split('.').reduce((current, key) => {
        if (current && typeof current === 'object' && key in current) {
          return current[key];
        }
        return undefined;
      }, obj);
    }

    function findByKey(value, acceptedKeys, visited = new Set()) {
      if (!value || typeof value !== 'object' || visited.has(value)) {
        return null;
      }

      visited.add(value);

      if (Array.isArray(value)) {
        for (const item of value) {
          const found = findByKey(item, acceptedKeys, visited);
          if (found !== null) {
            return found;
          }
        }
        return null;
      }

      for (const [key, child] of Object.entries(value)) {
        if (key === 'pagecode') {
          continue;
        }

        if (acceptedKeys.includes(normalizeKey(key))) {
          const normalized = normalizeCount(child);
          if (normalized !== null) {
            return normalized;
          }
        }

        const found = findByKey(child, acceptedKeys, visited);
        if (found !== null) {
          return found;
        }
      }

      return null;
    }

    function normalizeCount(value) {
      if (typeof value === 'number' && Number.isFinite(value)) {
        return value;
      }

      if (typeof value === 'string' && value.trim() !== '' && !Number.isNaN(Number(value))) {
        return Number(value);
      }

      if (Array.isArray(value)) {
        return value.length;
      }

      return null;
    }

    function countByResult(value, acceptedResults, visited = new Set()) {
      if (!value || typeof value !== 'object' || visited.has(value)) {
        return 0;
      }

      visited.add(value);

      if (Array.isArray(value)) {
        return value.reduce((total, item) => total + countByResult(item, acceptedResults, visited), 0);
      }

      let count = 0;

      for (const [key, child] of Object.entries(value)) {
        if (key === 'pagecode') {
          continue;
        }

        const normalizedKey = normalizeKey(key);
        if (['result', 'status', 'outcome', 'verdict'].includes(normalizedKey)) {
          const normalizedValue = String(child).trim().toLowerCase();
          if (acceptedResults.includes(normalizedValue)) {
            count++;
          }
        }

        count += countByResult(child, acceptedResults, visited);
      }

      return count;
    }

    function normalizeKey(key) {
      return key.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // Auto-focus and load URL from query parameter if provided
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      if (url) {
        urlInput.value = url;
        submitButton.click();
      }
    });
  </script>
</body>
</html>
