<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação por URL | AccessMonitor Wrapper</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0; min-height: 100vh;
      background: #f3f4f6; color: #111827;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
    }
    .page {
      width: min(100%, 860px); background: #fff;
      border-radius: 24px; box-shadow: 0 20px 75px rgba(15,23,42,.12);
      padding: 32px; box-sizing: border-box;
    }
    h1 { margin: 0 0 20px; font-size: clamp(1.6rem, 2.5vw, 2.2rem); }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input[type="text"] {
      width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1;
      border-radius: 14px; font-size: 1rem; color: #0f172a;
      outline: none; box-sizing: border-box;
    }
    input[type="text"]:focus { border-color: #2563eb; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; align-items: center; }
    button, .link-button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 20px; border: none; border-radius: 14px;
      background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .link-button.secondary, button.secondary { background: #e2e8f0; color: #0f172a; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    button.secondary:disabled { background: #f1f5f9; color: #94a3b8; }

    /* Sumário */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
    .summary-card { border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; background: #f8fafc; }
    .summary-card h2 { margin: 0 0 16px; font-size: 1rem; color: #475569; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

    /* Score gauge */
    .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .score-circle { position: relative; width: 120px; height: 120px; }
    .score-circle svg { transform: rotate(-90deg); }
    .score-circle .score-bg { fill: none; stroke: #e2e8f0; stroke-width: 10; }
    .score-circle .score-fg { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
    .score-text {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: #111827; line-height: 1;
    }
    .score-text small { font-size: .75rem; font-weight: 500; color: #64748b; margin-top: 2px; }

    /* Práticas */
    .practices-table { width: 100%; border-collapse: collapse; }
    .practices-table th { text-align: left; padding: 8px 12px; font-size: .8rem; color: #64748b; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
    .practices-table th:not(:first-child) { text-align: center; }
    .practices-table td { padding: 10px 12px; font-size: .95rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .practices-table td:not(:first-child) { text-align: center; font-weight: 600; }
    .practices-table tr:last-child td { border-bottom: none; font-weight: 700; background: #f8fafc; }
    .practice-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .practice-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .practice-icon.passed  { background: #dcfce7; color: #16a34a; border: 2px solid #16a34a; }
    .practice-icon.warning { background: #fef9c3; color: #ca8a04; border: 2px solid #ca8a04; }
    .practice-icon.failed  { background: #fee2e2; color: #dc2626; border: 2px solid #dc2626; }
    .practice-icon.total   { background: #f1f5f9; color: #475569; border: 2px solid #94a3b8; }

    /* Relatório completo */
    .panel { margin-top: 24px; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; }
    .panel header { padding: 18px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .panel header h2 { margin: 0; font-size: 1rem; }
    .panel .content { display: none; padding: 20px; }
    .panel .content.visible { display: block; }
    .report-layout { display: grid; gap: 16px; }
    details.report-group { border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; }
    details.report-group summary {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 14px 18px; cursor: pointer; list-style: none;
      font-weight: 700; background: #f8fafc;
    }
    details.report-group summary::-webkit-details-marker { display: none; }
    .report-count { color: #475569; font-weight: 600; }
    .report-list { display: grid; gap: 10px; padding: 12px; }
    .report-item { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; background: #fff; }
    .report-item.failed  { border-left: 5px solid #dc2626; }
    .report-item.warning { border-left: 5px solid #d97706; }
    .report-item.passed  { border-left: 5px solid #16a34a; }
    .report-item h3 { margin: 0 0 8px; font-size: .95rem; line-height: 1.4; }
    .report-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .pill { border-radius: 999px; padding: 3px 9px; font-size: .78rem; font-weight: 700; color: #334155; background: #e2e8f0; }
    .pill.failed  { color: #991b1b; background: #fee2e2; }
    .pill.warning { color: #92400e; background: #fef3c7; }
    .pill.passed  { color: #166534; background: #dcfce7; }
    .element-list { display: grid; gap: 8px; margin-top: 10px; }
    .element-card { border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; }
    .element-card code { display: block; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: .82rem; line-height: 1.5; }
    .element-pointer { margin: 6px 0 0; color: #475569; font-size: .82rem; }
    .raw-json {
      display: block; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, monospace; font-size: .82rem; line-height: 1.5;
      max-height: 520px; margin: 0; padding: 16px; border-radius: 12px;
      color: #e2e8f0; background: #0f172a;
    }
    .notice { padding: 18px; border-radius: 18px; background: #e0f2fe; color: #0c4a6e; border: 1px solid #bae6fd; margin-top: 24px; }
    .notice.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .notice.warn  { background: #fef9c3; color: #92400e; border-color: #fde68a; }
  </style>
</head>
<body>
  <main class="page">
    <h1>Validar página por URL</h1>
    <label for="urlInput">URL da página</label>
    <input id="urlInput" type="text" placeholder="https://example.com" autocomplete="url" />
    <div class="actions">
      <button id="submitButton">Validar</button>
      <button id="toggleReportButton" class="secondary" disabled>Mostrar relatório completo</button>
      <a class="link-button secondary" href="/ValidateHtml.html">Validar HTML</a>
    </div>
    <div id="resultArea"></div>
    <div class="panel" id="reportPanel" hidden>
      <header><h2>Relatório completo</h2></header>
      <div class="content" id="reportContent"></div>
    </div>
  </main>

  <script>
    const submitButton       = document.getElementById('submitButton');
    const toggleReportButton = document.getElementById('toggleReportButton');
    const urlInput           = document.getElementById('urlInput');
    const resultArea         = document.getElementById('resultArea');
    const reportPanel        = document.getElementById('reportPanel');
    const reportContent      = document.getElementById('reportContent');
    let latestReport = null;

    submitButton.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      resultArea.innerHTML = '';
      reportPanel.hidden = true;
      reportContent.innerHTML = '';
      reportContent.classList.remove('visible');
      toggleReportButton.disabled = true;
      toggleReportButton.textContent = 'Mostrar relatório completo';
      latestReport = null;

      if (!url) {
        resultArea.innerHTML = '<p class="notice error">Insira um URL válido antes de continuar.</p>';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'A validar...';

      try {
        const res  = await fetch('/api/validate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
        const json = await res.json().catch(() => { throw new Error('Resposta inválida do servidor.'); });

        if (!res.ok) {
          resultArea.innerHTML = `<div class="notice error"><strong>Erro ${res.status}</strong><br>${json.error || res.statusText}</div>`;
          return;
        }

        latestReport = json;
        renderSummary(json);
        renderReport(json);
        toggleReportButton.disabled = false;
      } catch (err) {
        resultArea.innerHTML = `<div class="notice warn"><strong>Falha ao contactar a API</strong><br>${err.message}</div>`;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Validar';
      }
    });

    toggleReportButton.addEventListener('click', () => {
      const visible = reportContent.classList.toggle('visible');
      reportPanel.hidden = !visible;
      toggleReportButton.textContent = visible ? 'Ocultar relatório completo' : 'Mostrar relatório completo';
    });

    // ── Helpers ──────────────────────────────────────────────────────────────

    const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

    const getInner = r => r?.data?.data ?? r?.data ?? r;

    function normalizeVerdict(v) {
      const s = String(v ?? '').trim().toLowerCase();
      if (['failed','fail','false'].includes(s)) return 'failed';
      if (['warning','warn'].includes(s)) return 'warning';
      if (['passed','pass','true','success'].includes(s)) return 'passed';
      return 'inapplicable';
    }

    function getWcagLevelMap() {
      return {
        // A
        titleOk:'A', lang:'A', langValid:'A', button:'A', buttonAname:'A',
        a:'A', linkAName:'A', aSkip:'A', aSkipFirst:'A', img:'A', imgAltNull:'A',
        label:'A', labelAName:'A', form:'A', iframe:'A', hx:'A', h1:'A', hxHasAName:'A',
        li:'A', svg:'A', elementRole:'A', roleValid:'A', elementDec:'A',
        ariaStPermitted:'A', ariaAtribDefined:'A', ariaStValid:'A',
        mainTopLevel:'A', noDuplicateMain:'A', autocomplete:'A',
        videoAudio:'A', audio:'A', meta:'A', metaRefresh:'A', focusVisible:'A',
        // AA
        colorContrastOk:'AA', textContrastHNot:'AA', colorFgBgNo:'AA',
        contentinfoTopLevel:'AA', noDuplicateContentinfo:'AA',
        onlyOneh1:'AA', aSameText:'AA', headers:'AA',
        tableData:'AA', tableLayout:'AA', tableComplex:'AA',
        liSemantically:'AA', listCorrectly:'AA',
        elementHiddenFocus:'AA', elementPresentChildrenNoFocus:'AA',
        resizeText:'AA', orientation:'AA', reflow:'AA',
        inputPurpose:'AA', identify:'AA', errorSuggestion:'AA', errorPrevention:'AA',
        focusOrder:'AA', focusNotObscured:'AA', targetSize:'AA',
        // AAA
        scrollable:'AAA', iframeSame:'AAA', aGrouped:'AAA', abbrDefined:'AAA',
      };
    }

    function extractPractices(report) {
      const nodes = getInner(report)?.nodes;
      if (!nodes || typeof nodes !== 'object') return null;

      const wcagLevels = getWcagLevelMap();
      const counts = { passed: 0, warning: 0, failed: 0 };
      const breakdown = { passed: {A:0,AA:0,AAA:0}, warning: {A:0,AA:0,AAA:0}, failed: {A:0,AA:0,AAA:0} };

      for (const [criterion, checks] of Object.entries(nodes)) {
        if (!Array.isArray(checks) || !checks.length) continue;
        const verdicts = checks.map(c => normalizeVerdict(c.verdict));
        const dominant = verdicts.includes('failed') ? 'failed'
                       : verdicts.includes('warning') ? 'warning'
                       : verdicts.every(v => v === 'inapplicable') ? null : 'passed';
        if (!dominant) continue;
        counts[dominant]++;
        breakdown[dominant][wcagLevels[criterion] ?? 'A']++;
      }

      const total = counts.passed + counts.warning + counts.failed;
      const totalBreakdown = {
        A:   breakdown.passed.A   + breakdown.warning.A   + breakdown.failed.A,
        AA:  breakdown.passed.AA  + breakdown.warning.AA  + breakdown.failed.AA,
        AAA: breakdown.passed.AAA + breakdown.warning.AAA + breakdown.failed.AAA,
      };
      return { counts, breakdown, total, totalBreakdown };
    }

    // ── Render Sumário ────────────────────────────────────────────────────────

    function renderSummary(report) {
      const inner     = getInner(report);
      const practices = extractPractices(report);
      const totalElems = inner?.elems
        ? Object.values(inner.elems).reduce((s, v) => s + (typeof v === 'number' ? v : 0), 0)
        : null;
      const score = inner?.score != null ? parseFloat(inner.score) : null;

      resultArea.innerHTML = `
        <div class="summary-grid">
          <div class="summary-card">
            <h2>Sumário</h2>
            <div class="score-wrap">
              ${renderScoreGauge(score)}
              ${inner?.title ? `<div style="margin-top:12px;font-weight:600;font-size:.95rem;color:#374151;text-align:center">${esc(inner.title)}</div>` : ''}
              ${totalElems != null ? `<div style="font-size:1.5rem;font-weight:800;margin-top:8px">${totalElems}</div><div style="color:#64748b;font-size:.85rem">Elementos (x)HTML</div>` : ''}
            </div>
          </div>
          <div class="summary-card">
            <h2>Tipo de prática</h2>
            ${practices ? renderPracticesTable(practices) : '<p style="color:#64748b">Sem dados de práticas.</p>'}
          </div>
        </div>`;

      if (score != null) animateGauge(score);
    }

    function renderScoreGauge(score) {
      const val  = score ?? 0;
      const r    = 50, circ = 2 * Math.PI * r, dash = circ * 0.75;
      const color = val >= 7 ? '#16a34a' : val >= 4 ? '#d97706' : '#dc2626';
      return `
        <div class="score-circle">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle class="score-bg" cx="60" cy="60" r="${r}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-(circ*.125)}" />
            <circle class="score-fg" id="gaugeArc" cx="60" cy="60" r="${r}" stroke="${color}"
              stroke-dasharray="${dash} ${circ-dash}"
              stroke-dashoffset="${dash + circ*.125}"
              data-target="${-((dash - val/10*dash) - circ*.125)}" />
          </svg>
          <div class="score-text">${score ?? '—'}<small>Pontuação</small></div>
        </div>`;
    }

    function animateGauge(score) {
      const arc = document.getElementById('gaugeArc');
      if (!arc) return;
      requestAnimationFrame(() => {
        arc.style.transition = 'stroke-dashoffset .8s ease';
        arc.style.strokeDashoffset = arc.dataset.target;
      });
    }

    function renderPracticesTable(p) {
      const rows = [
        { key: 'passed',  label: 'Aceitáveis',          icon: '✓', cls: 'passed'  },
        { key: 'warning', label: 'Para ver manualmente', icon: '−', cls: 'warning' },
        { key: 'failed',  label: 'Não aceitáveis',       icon: '✕', cls: 'failed'  },
      ];
      const trs = rows.map(row => `
        <tr>
          <td><div class="practice-badge"><span class="practice-icon ${row.cls}">${row.icon}</span>${row.label} (${p.counts[row.key]})</div></td>
          <td>${p.breakdown[row.key].A}</td><td>${p.breakdown[row.key].AA}</td><td>${p.breakdown[row.key].AAA}</td>
        </tr>`).join('');
      return `
        <div style="margin-bottom:8px;color:#64748b;font-size:.9rem">${p.total} práticas encontradas</div>
        <table class="practices-table">
          <thead><tr><th>Tipo de prática</th><th>A</th><th>AA</th><th>AAA</th></tr></thead>
          <tbody>
            ${trs}
            <tr>
              <td><div class="practice-badge"><span class="practice-icon total">Σ</span>Total (${p.total})</div></td>
              <td>${p.totalBreakdown.A}</td><td>${p.totalBreakdown.AA}</td><td>${p.totalBreakdown.AAA}</td>
            </tr>
          </tbody>
        </table>`;
    }

    // ── Render Relatório Completo ─────────────────────────────────────────────

    function renderReport(report) {
      const nodes = getInner(report)?.nodes ?? {};
      const items = [];
      for (const [criterion, checks] of Object.entries(nodes)) {
        if (!Array.isArray(checks)) continue;
        for (const check of checks) {
          const v = normalizeVerdict(check.verdict);
          if (v !== 'inapplicable') items.push({ criterion, verdict: v, raw: check });
        }
      }

      const groups = {
        failed:  { title: 'Não aceitáveis (Erros)',        items: items.filter(i => i.verdict === 'failed')  },
        warning: { title: 'Para ver manualmente (Avisos)', items: items.filter(i => i.verdict === 'warning') },
        passed:  { title: 'Aceitáveis',                    items: items.filter(i => i.verdict === 'passed')  },
      };

      reportContent.innerHTML = `
        <div class="report-layout">
          ${Object.entries(groups).map(([type, g]) => `
            <details class="report-group" ${type !== 'passed' ? 'open' : ''}>
              <summary><span>${g.title}</span><span class="report-count">${g.items.length}</span></summary>
              <div class="report-list">
                ${g.items.length ? g.items.map(renderItem).join('') : '<div class="notice">Nenhum resultado nesta categoria.</div>'}
              </div>
            </details>`).join('')}
          <details class="report-group">
            <summary><span>JSON técnico</span><span class="report-count">relatório bruto</span></summary>
            <pre class="raw-json">${esc(JSON.stringify(report, null, 2))}</pre>
          </details>
        </div>`;
    }

    function renderItem(item) {
      const check = item.raw;
      const els   = (check.elements ?? []).slice(0, 6);
      return `
        <article class="report-item ${item.verdict}">
          <div class="report-meta">
            <span class="pill ${item.verdict}">${item.verdict}</span>
            <span class="pill">${esc(item.criterion)}</span>
            ${check.resultCode ? `<span class="pill">${esc(check.resultCode)}</span>` : ''}
          </div>
          <h3>${esc(check.description ?? 'Sem descrição.')}</h3>
          ${els.length ? `
            <div class="element-list">
              ${els.map((el, i) => `
                <div class="element-card">
                  <strong>Elemento ${i+1}</strong>
                  ${el.htmlCode        ? `<code>${esc(el.htmlCode)}</code>` : ''}
                  ${el.pointer        ? `<p class="element-pointer">📍 ${esc(el.pointer)}</p>` : ''}
                  ${el.accessibleName ? `<p class="element-pointer">Nome acessível: ${esc(el.accessibleName)}</p>` : ''}
                </div>`).join('')}
              ${(check.elements?.length ?? 0) > 6 ? `<p class="element-pointer">+ ${check.elements.length - 6} elemento(s) adicionais</p>` : ''}
            </div>` : ''}
        </article>`;
    }

    window.addEventListener('load', () => {
      const url = new URLSearchParams(window.location.search).get('url');
      if (url) { urlInput.value = url; submitButton.click(); }
    });
  </script>
</body>
</html>
