<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validar URL</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0; min-height: 100vh;
      background: #f3f4f6; color: #111827;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 32px 24px; box-sizing: border-box;
    }
    .page {
      width: min(100%, 860px); background: #fff;
      border-radius: 24px; box-shadow: 0 20px 75px rgba(15,23,42,.12);
      padding: 32px; box-sizing: border-box;
    }
    h1 { margin: 0 0 20px; font-size: clamp(1.6rem, 2.5vw, 2.2rem); }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input[type="text"] {
      width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1;
      border-radius: 14px; font-size: 1rem; color: #0f172a;
      outline: none; box-sizing: border-box;
    }
    input[type="text"]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; align-items: center; }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 20px; border: none; border-radius: 14px;
      background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .link-button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 20px; border-radius: 14px;
      background: #e2e8f0; color: #0f172a; font-size: 1rem; font-weight: 600;
      text-decoration: none;
    }

    .summary-card {
      display: flex; align-items: center; gap: 28px;
      border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px 28px;
      background: #f8fafc; margin-top: 28px; flex-wrap: wrap;
    }

    .score-circle { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
    .score-circle svg { transform: rotate(-90deg); }
    .score-bg { fill: none; stroke: #e2e8f0; stroke-width: 10; }
    .score-fg { fill: none; stroke-width: 10; stroke-linecap: round; }
    .score-text {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 800; color: #111827; line-height: 1;
    }
    .score-text small { font-size: .7rem; font-weight: 500; color: #64748b; margin-top: 2px; }

    .score-meta { display: flex; flex-direction: column; gap: 2px; }
    .score-title { font-weight: 700; font-size: 1rem; color: #111827; }
    .score-elems-row { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
    .score-elems { font-size: 1.5rem; font-weight: 800; color: #111827; }
    .score-elems-label { font-size: .8rem; color: #64748b; }

    .summary-divider {
      width: 1px; background: #e2e8f0; align-self: stretch; flex-shrink: 0;
    }
    @media (max-width: 600px) { .summary-divider { display: none; } }

    .results-summary {
      display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;
    }
    .result-pill {
      display: flex; align-items: center; gap: 8px;
      border-radius: 20px; padding: 8px 16px;
      font-weight: 700; font-size: .95rem; border: 1.5px solid transparent;
    }
    .result-pill .pill-count {
      font-size: 1.3rem; font-weight: 800; line-height: 1;
    }
    .result-pill.passed  { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .result-pill.warning { background: #fef9c3; color: #92400e; border-color: #fde68a; }
    .result-pill.failed  { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

    .notice { padding: 18px; border-radius: 18px; margin-top: 24px; }
    .notice.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .notice.warn  { background: #fef9c3; color: #92400e; border: 1px solid #fde68a; }

    .spin {
      width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: sp .6s linear infinite; flex-shrink: 0;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .page { padding: 20px; }
      .summary-card { flex-direction: column; gap: 16px; padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Validar página por URL</h1>
    <label for="urlInput">URL da página</label>
    <input id="urlInput" type="text" placeholder="https://example.com" autocomplete="url" />
    <div class="actions">
      <button id="submitButton">Validar</button>
      <a class="link-button" href="/ValidateHtml.html">Validar HTML</a>
    </div>

    <div id="resultArea"></div>
  </main>

  <script>
    const submitBtn  = document.getElementById('submitButton');
    const urlInput   = document.getElementById('urlInput');
    const resultArea = document.getElementById('resultArea');
    let ac = null;

    const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

    function getInner(r) { return r?.data?.data ?? r?.data ?? r; }

    function normalizeVerdict(v) {
      const s = String(v ?? '').trim().toLowerCase();
      if (['failed','fail','false'].includes(s)) return 'failed';
      if (['warning','warn'].includes(s))        return 'warning';
      if (['passed','pass','true','success'].includes(s)) return 'passed';
      return 'inapplicable';
    }

    function extractItems(report) {
      const nodes = getInner(report)?.nodes ?? {};
      const items = [];
      for (const [criterion, checks] of Object.entries(nodes)) {
        if (!Array.isArray(checks)) continue;
        for (const check of checks) {
          const v = normalizeVerdict(check.verdict);
          if (v !== 'inapplicable') items.push({ verdict: v, raw: check });
        }
      }
      return items;
    }

    function renderGauge(score, targetId) {
      const val = score ?? 0;
      const r = 46, circ = 2 * Math.PI * r, dash = circ * 0.75;
      const color = val >= 7 ? '#16a34a' : val >= 4 ? '#d97706' : '#dc2626';
      const target = -((dash - val / 10 * dash) - circ * .125);
      return {
        html: `
          <div class="score-circle">
            <svg viewBox="0 0 110 110" width="110" height="110">
              <circle class="score-bg" cx="55" cy="55" r="${r}"
                stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-(circ*.125)}" />
              <circle class="score-fg" id="${targetId}" cx="55" cy="55" r="${r}"
                stroke="${color}"
                stroke-dasharray="${dash} ${circ-dash}"
                stroke-dashoffset="${dash + circ*.125}"
                data-target="${target}" />
            </svg>
            <div class="score-text">${score ?? '—'}<small>Pontuação</small></div>
          </div>`,
        target
      };
    }

    function countVerdicts(report) {
      const items = extractItems(report);
      return items.reduce((acc, item) => {
        acc[item.verdict] = (acc[item.verdict] ?? 0) + 1;
        return acc;
      }, { passed: 0, warning: 0, failed: 0 });
    }

    function renderSummary(report) {
      const inner = getInner(report);
      const score = inner?.score != null ? parseFloat(inner.score) : 0;
      const totalElems = inner?.elems
        ? Object.values(inner.elems).reduce((s, v) => s + (typeof v === 'number' ? v : 0), 0)
        : null;

      const counts = countVerdicts(report);
      const gauge = renderGauge(score, 'gaugeArc');

      sessionStorage.setItem('currentReport', JSON.stringify(report));

      resultArea.innerHTML = `
        <div class="summary-card">
          ${gauge.html}
          <div class="score-meta">
            ${inner?.title ? `<div class="score-title" style="font-weight: 700; font-size: 1.1rem; color: #111827; margin-bottom: 4px;">${esc(inner.title)}</div>` : ''}
            ${totalElems != null ? `
              <div class="score-elems-row" style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px;">
                <span class="score-elems" style="font-size: 1.5rem; font-weight: 800; color: #111827;">${totalElems}</span>
                <span class="score-elems-label" style="font-size: .8rem; color: #64748b;">Elementos (x)HTML</span>
              </div>` : ''}
            <div class="results-summary">
              <div class="result-pill passed">
                <span class="pill-count">${counts.passed}</span>
                <span>Passou</span>
              </div>
              <div class="result-pill warning">
                <span class="pill-count">${counts.warning}</span>
                <span>Avisos</span>
              </div>
              <div class="result-pill failed">
                <span class="pill-count">${counts.failed}</span>
                <span>Falhou</span>
              </div>
            </div>
          </div>
          <div class="summary-divider"></div>
          <div style="display: flex; align-items: center;">
            <a class="link-button" href="/Report.html" style="background: #2563eb; color: #fff; text-decoration: none;">
              Ver relatório completo
            </a>
          </div>
        </div>`;

      requestAnimationFrame(() => {
        const arc = document.getElementById('gaugeArc');
        if (arc) {
          arc.style.transition = 'stroke-dashoffset .8s ease';
          arc.style.strokeDashoffset = arc.dataset.target;
        }
      });
    }

    submitBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      resultArea.innerHTML = '';
      if (ac) { ac.abort(); }
      ac = new AbortController();

      if (!url) {
        resultArea.innerHTML = '<p class="notice error">Insira um URL válido antes de continuar.</p>';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spin"></span> A validar…';

      try {
        const res  = await fetch('/api/validate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }), signal: ac.signal });
        const json = await res.json().catch(() => { throw new Error('Resposta inválida do servidor.'); });

        if (!res.ok) {
          resultArea.innerHTML = `<div class="notice error"><strong>Erro ${res.status}</strong><br>${esc(json.error ?? res.statusText)}</div>`;
          return;
        }

        sessionStorage.setItem('lastUrl', url);
        sessionStorage.setItem('lastUrlReport', JSON.stringify(json));
        renderSummary(json);
      } catch (err) {
        if (err.name !== 'AbortError') {
          resultArea.innerHTML = `<div class="notice warn"><strong>Falha ao contactar a API</strong><br>${esc(err.message)}</div>`;
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Validar';
      }
    });

    window.addEventListener('load', () => {
      const url = new URLSearchParams(window.location.search).get('url');
      if (url) {
        urlInput.value = url;
        submitBtn.click();
      } else {
        const lastUrl = sessionStorage.getItem('lastUrl');
        const lastReport = sessionStorage.getItem('lastUrlReport');
        if (lastUrl && lastReport) {
          urlInput.value = lastUrl;
          renderSummary(JSON.parse(lastReport));
        }
      }
    });
  </script>
</body>
</html>
